<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Rule-based idle resource detection</title>
  <desc id="desc">Conceptual flow from operational metrics through a fixed threshold rule and exception review to a resource recovery report. AI assists query and report drafting, not detection. No internal thresholds or identifiers are shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#68686e" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="630" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#1d1d1f">
    <text x="60" y="69" font-size="19" fill="#28695f">INFRASTRUCTURE ANALYTICS</text>
    <text x="60" y="130" font-size="40" font-weight="700">Detection to recovery review</text>
    <path d="M60 163H1060" stroke="#e5e5e8" stroke-width="2"/>
    <g font-size="20" fill="#68686e"><text x="60" y="219">OBSERVE</text><text x="320" y="219">DETECT</text><text x="580" y="219">REVIEW</text><text x="840" y="219">REPORT</text></g>
    <g fill="#f5f5f7" stroke="#e5e5e8" stroke-width="2"><rect x="60" y="245" width="220" height="145" rx="6"/><rect x="320" y="245" width="220" height="145" rx="6"/><rect x="580" y="245" width="220" height="145" rx="6"/><rect x="840" y="245" width="220" height="145" rx="6"/></g>
    <g font-size="27" font-weight="700"><text x="82" y="301">Operational</text><text x="82" y="341">metrics</text><text x="342" y="301">Fixed</text><text x="342" y="341">threshold</text><text x="602" y="301">Exception</text><text x="602" y="341">review</text><text x="862" y="301">Recovery</text><text x="862" y="341">report</text></g>
    <g stroke="#68686e" stroke-width="2" marker-end="url(#arrow)"><path d="M286 316H310"/><path d="M546 316H570"/><path d="M806 316H830"/></g>
    <path d="M60 438V537" stroke="#b73553" stroke-width="5"/>
    <text x="85" y="475" font-size="29" font-weight="700">AI-assisted authoring</text>
    <text x="85" y="516" font-size="23" fill="#68686e">Query checks and report drafts / Rule-based detection</text>
    <text x="60" y="591" font-size="19" fill="#68686e">METHOD OVERVIEW / NO INTERNAL THRESHOLDS OR IDENTIFIERS</text>
  </g>
</svg>
