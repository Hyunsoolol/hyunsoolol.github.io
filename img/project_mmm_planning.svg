<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Marketing mix model planning</title>
  <desc id="desc">A model planning overview linking a business question, data requirements and an MMM specification. This is not an estimated response curve or a budget recommendation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#68686e" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="630" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#1d1d1f">
    <text x="60" y="69" font-size="19" fill="#28695f">MARKETING ANALYTICS</text>
    <text x="60" y="130" font-size="40" font-weight="700">From business question to model scope</text>
    <path d="M60 163H1060" stroke="#e5e5e8" stroke-width="2"/>
    <g font-size="20" fill="#68686e"><text x="60" y="219">DEFINE</text><text x="410" y="219">ASSESS</text><text x="760" y="219">SPECIFY</text></g>
    <g fill="#f5f5f7" stroke="#e5e5e8" stroke-width="2"><rect x="60" y="245" width="300" height="145" rx="6"/><rect x="410" y="245" width="300" height="145" rx="6"/><rect x="760" y="245" width="300" height="145" rx="6"/></g>
    <g font-size="28" font-weight="700"><text x="85" y="301">Business question</text><text x="435" y="301">Data requirements</text><text x="785" y="301">MMM design</text></g>
    <g font-size="23" fill="#68686e"><text x="85" y="346">Budget decisions</text><text x="435" y="346">Inputs / Outcomes</text><text x="785" y="346">Scope / Feasibility</text></g>
    <g stroke="#68686e" stroke-width="2" marker-end="url(#arrow)"><path d="M365 316H399"/><path d="M715 316H749"/></g>
    <path d="M60 438V537" stroke="#b73553" stroke-width="5"/>
    <text x="85" y="475" font-size="29" font-weight="700">Planning-stage work</text>
    <text x="85" y="516" font-size="23" fill="#68686e">Model requirements / Not deployed optimization results</text>
    <text x="60" y="591" font-size="19" fill="#68686e">CONCEPTUAL OVERVIEW / NO SPEND DATA OR ESTIMATED RESPONSE CURVES</text>
  </g>
</svg>
