<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
  <title id="title">Forecasting and performance review</title>
  <desc id="desc">A conceptual workflow from daily revenue and activity to a GAM forecast, comparison with observed performance and business review. No business data or model outputs are shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#68686e" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="630" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#1d1d1f">
    <text x="60" y="69" font-size="19" fill="#28695f">STATISTICAL MODELING</text>
    <text x="60" y="130" font-size="40" font-weight="700">Forecasting to business review</text>
    <path d="M60 163H1060" stroke="#e5e5e8" stroke-width="2"/>
    <g fill="#68686e" font-size="20"><text x="60" y="219">INPUT</text><text x="410" y="219">MODEL</text><text x="760" y="219">COMPARISON</text></g>
    <g stroke="#e5e5e8" stroke-width="2" fill="#f5f5f7"><rect x="60" y="245" width="300" height="145" rx="6"/><rect x="410" y="245" width="300" height="145" rx="6"/><rect x="760" y="245" width="300" height="145" rx="6"/></g>
    <g font-size="28" font-weight="700"><text x="85" y="301">Daily time series</text><text x="435" y="301">GAM forecast</text><text x="785" y="301">Observed vs.</text><text x="785" y="341">forecast</text></g>
    <g font-size="23" fill="#68686e"><text x="85" y="346">Revenue / Activity</text><text x="435" y="346">Baseline estimates</text></g>
    <g stroke="#68686e" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M365 316H399"/><path d="M715 316H749"/><path d="M910 397V461H684"/></g>
    <path d="M60 438V537" stroke="#b73553" stroke-width="5"/>
    <text x="85" y="475" font-size="29" font-weight="700">Performance review</text>
    <text x="85" y="516" font-size="23" fill="#68686e">Interpret changes and support decisions</text>
    <text x="60" y="591" font-size="19" fill="#68686e">METHOD OVERVIEW / NO BUSINESS DATA</text>
  </g>
</svg>
